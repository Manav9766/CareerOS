<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CareerOS — Personal Job Acquisition & Career Execution System" />
  <title>CareerOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // One-time cleanup for the legacy demo workspace. This intentionally
    // removes only the old CareerOS v1 browser state so the app boots from
    // the current clean seed. The marker prevents repeated resets later.
    (() => {
      const migrationKey = 'careeros-clean-migration-2026-08-31';
      if (!localStorage.getItem(migrationKey)) {
        localStorage.removeItem('careeros-state-v1');
        localStorage.setItem(migrationKey, 'done');
      }
    })();
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
